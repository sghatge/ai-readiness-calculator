<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Readiness Calculator</title>
<meta name="description" content="Employee AI readiness self-assessment with personal report, team dashboard and method.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F3F5F7;--surface:#FFFFFF;--ink:#101828;--ink2:#344054;--muted:#475467;--line:#D0D5DD;--line2:#EAECF0;--field:#98A2B3;
  --accent:#1D4ED8;--accent-dk:#1E3A8A;--mid:#6F95DD;--soft:#A9C1EC;--warn:#C4540A;--warn-tx:#8A3505;--warn-bg:#FEF0E6;--warn-bd:#F5B183;
  --s-gap:#C4540A;--s-mid:#5B82D6;--s-strong:#1E3A8A;--head:#101828;--head-tx:#FFFFFF;--head-sub:#D0D5DD;--track:#EAECF0;--chip-on:#101828;--chip-on-tx:#FFFFFF;--tile:#F3F5F7;--th:#F9FAFB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B111C;--surface:#121A28;--ink:#F2F4F7;--ink2:#D0D5DD;--muted:#A6B0C0;--line:#2B3546;--line2:#222C3B;--field:#56637A;
    --accent:#5B8DEF;--accent-dk:#9DB8F2;--warn:#F08A4B;--warn-tx:#F7B98E;--warn-bg:#2A1A10;--warn-bd:#6B3A1C;
    --s-gap:#F08A4B;--s-mid:#6F95DD;--s-strong:#B9CDF5;--head:#060A12;--track:#222C3B;--chip-on:#F2F4F7;--chip-on-tx:#101828;--tile:#182233;--th:#172030;
  }
}
:root[data-theme="dark"]{
  --ground:#0B111C;--surface:#121A28;--ink:#F2F4F7;--ink2:#D0D5DD;--muted:#A6B0C0;--line:#2B3546;--line2:#222C3B;--field:#56637A;
  --accent:#5B8DEF;--accent-dk:#9DB8F2;--warn:#F08A4B;--warn-tx:#F7B98E;--warn-bg:#2A1A10;--warn-bd:#6B3A1C;
  --s-gap:#F08A4B;--s-mid:#6F95DD;--s-strong:#B9CDF5;--head:#060A12;--track:#222C3B;--chip-on:#F2F4F7;--chip-on-tx:#101828;--tile:#182233;--th:#172030;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--accent)}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
header.top{background:var(--head);color:var(--head-tx)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:18px 0}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.brand{font-size:20px;font-weight:600}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{color:var(--head-sub);text-decoration:none;padding:10px 14px;border-radius:8px;min-height:44px;display:inline-flex;align-items:center}
nav.tabs a[aria-current="page"]{background:#1F2A3D;color:#fff;font-weight:600}
.progress{display:flex;align-items:center;gap:12px;padding:0 0 16px}
.progress .bar{flex:1;height:6px;background:#344054;border-radius:3px;overflow:hidden}
.progress .bar span{display:block;height:6px;background:var(--soft)}
.progress .lbl{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--head-sub);white-space:nowrap}
main{padding:28px 0 72px}
.stack{display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.card h2{margin:0 0 14px;font-size:19px;font-weight:600}
h1.page{margin:0;font-size:32px;line-height:1.2;font-weight:600}
.lead{margin:0;color:var(--muted);font-size:17px;max-width:740px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.legend{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{min-height:44px;padding:8px 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface);color:var(--ink)}
.anon{display:flex;gap:12px;align-items:flex-start;background:var(--tile);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.anon input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.anon small{display:block;color:var(--muted);font-size:14px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:46px;padding:10px 14px;border-radius:8px;border:1px solid var(--field);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{border-radius:22px;padding:8px 16px}
.chip.dark[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-tx)}
.likert{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mc{display:flex;flex-direction:column;gap:8px}
.q legend{font-size:17px;font-weight:500;margin-bottom:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btnrow.split{justify-content:space-between}
.btn{min-height:48px;padding:12px 24px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--field);font-weight:400}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{background:var(--head);color:#fff;border-radius:16px;padding:28px;display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:center}
.hero .big{font-family:'IBM Plex Mono',monospace;font-size:80px;font-weight:600;line-height:1}
.hero .sub{color:var(--head-sub)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale div span{display:block;height:14px;border-radius:4px;margin-bottom:6px}
.scale div.cur span{outline:2px solid #fff;outline-offset:2px}
.scale small{font-size:12px;line-height:1.3;color:var(--head-sub);display:block}
.scale div.cur small{color:#fff;font-weight:600}
.flags{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:14px;padding:22px}
.flags h2{margin:0 0 12px;font-size:18px;color:var(--warn-tx)}
.flags p{margin:0 0 10px;color:var(--ink2)}
.flags strong{color:var(--ink);display:block}
.barrow{display:grid;grid-template-columns:minmax(150px,2fr) minmax(100px,3fr) 48px;gap:14px;align-items:center;margin-bottom:12px}
.barrow small{display:block;font-size:12px;color:var(--muted)}
.track{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.track span{display:block;height:100%;border-radius:5px}
.num{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right}
.legendrow{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--muted)}
.legendrow i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.list-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line2);padding:8px 0}
.tile{background:var(--tile);border-radius:10px;padding:16px}
.tile .tag{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);font-weight:600;display:block}
.tile strong{display:block;margin:4px 0}
.tile p{margin:0;font-size:14px;color:var(--ink2)}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.kpi .v{font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:600;line-height:1.1}
.kpi .l{font-size:14px;color:var(--muted)}
.kpi.warn{background:var(--warn-bg);border-color:var(--warn-bd)}
.kpi.warn .l{color:var(--warn-tx)}
.tbl{overflow-x:auto;border:1px solid var(--line2);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--th);white-space:nowrap}
td.low{background:var(--warn-bg)}
code{font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--tile);padding:2px 6px;border-radius:4px;word-break:break-word}
.badge{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#101828;background:#FDE7D4;padding:6px 12px;border-radius:6px}
.phase{border-top:4px solid;background:var(--th);border-radius:0 0 10px 10px;padding:16px}
footer{color:var(--muted);font-size:13px;padding:0 0 40px}
.dcard{background:#FFF8E1;color:#1F2937;border:1px solid #E8D48A;border-radius:6px;padding:20px;box-shadow:0 2px 0 #E8D48A}
.dcard ul.clean{color:#1F2937}
.dcard .mono{color:#7A3A06!important}
body.projector{font-size:20px}
body.projector .wrap{max-width:1440px}
body.projector h1.page{font-size:46px}
body.projector .card h2{font-size:26px}
body.projector .kpi .v{font-size:64px}
body.projector .dcard div[style*="font-size:20px"]{font-size:28px!important}
body.projector .dcard li{font-size:22px}
body.projector{--muted:var(--ink2)}
@media print{
  @page{size:A4;margin:12mm}
  :root:not([data-print]){--ground:#fff;--surface:#fff;--ink:#101828;--ink2:#344054;--muted:#475467;--line:#D0D5DD;--line2:#EAECF0;--accent:#1D4ED8;--warn:#C4540A;--warn-tx:#8A3505;--warn-bg:#FEF0E6;--s-gap:#C4540A;--s-mid:#5B82D6;--s-strong:#1E3A8A;--tile:#F3F5F7;--track:#EAECF0}
  body{background:#fff;font-size:12pt}
  header.top,footer,.noprint{display:none!important}
  main{padding:0}
  .card{break-inside:avoid;border-color:#D0D5DD}
  .sheet{border:0;padding:0}
  .sheet svg{max-width:300px!important}
  .dcard{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:560px){.hero .big{font-size:64px}h1.page{font-size:26px}.barrow{grid-template-columns:1fr 44px}.barrow .track{grid-column:1/-1;grid-row:2}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div><div class="eyebrow">AI adoption toolkit</div><div class="brand">AI Readiness Calculator</div></div>
      <nav class="tabs" aria-label="Sections">
        <a href="#assess" data-tab="assess">Assessment</a>
        <a href="#history" data-tab="history">History</a>
        <a href="#workshop" data-tab="workshop">Workshop</a>
        <a href="#team" data-tab="team">Team report</a>
        <a href="#method" data-tab="method">Method</a>
      </nav>
    </div>
    <div class="progress" id="progress"><div class="bar"><span id="pbar" style="width:0%"></span></div><span class="lbl" id="plbl">Profile</span></div>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer class="wrap">Responses are scored in your browser and are never sent anywhere. Saved team results stay in this browser only.</footer>

<script>
"use strict";
/* ---------------- Data ---------------- */
const LIKERT = ["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"];
const DEPTS = ["CRM & Marketing Ops","Marketing","Sales","Customer Support","Engineering / IT","Finance","HR / People","Operations","Other"];
const SENIORITIES = ["Junior","Mid-level","Senior","Manager / lead","Director and above"];
const FREQS = ["Never","Rarely (less than monthly)","Monthly","Weekly","Daily"];
const TOOLS = ["ChatGPT","Microsoft Copilot","Google Gemini","Claude","GitHub Copilot","Adobe Firefly","Salesforce Einstein","Other","None yet"];
const LEVELS = [
  {min:0, name:"AI Beginner", band:"0–39", label:"Not ready", color:"#DCE6F7", desc:"Not ready yet: needs foundations, tool access and support before using AI at work.", next:"Next: fundamentals, policy and tool access"},
  {min:40,name:"AI Aware", band:"40–59", label:"Emerging", color:"#A9C1EC", desc:"Emerging: understands the basics but rarely applies AI to real work yet.", next:"Next: hands-on labs and use-case mapping"},
  {min:60,name:"AI Practitioner", band:"60–74", label:"Developing", color:"#6F95DD", desc:"Developing: uses AI for some tasks and needs structured practice to make it routine.", next:"Next: verification practice and a champion pairing"},
  {min:75,name:"AI Confident", band:"75–89", label:"Ready", color:"#3563C9", desc:"Ready: applies AI regularly with sound judgement and is ready for advanced use cases.", next:"Next: advanced workflows and automation"},
  {min:90,name:"AI Champion", band:"90–100", label:"Advanced", color:"#1E3A8A", desc:"Advanced: uses AI fluently and responsibly on real work, and helps others do the same.", next:"Next: champion role, use-case library owner"}
];
const DIMS = [
  {id:"aw",name:"AI awareness",short:"Aware",basis:"ADKAR Awareness",w:8,why:"Do you understand what AI tools do, where they fail, and which ones are approved?",rationale:"A prerequisite, but knowing about AI alone does not change work.",
   qs:[{id:"aw1",type:"l",text:"I can explain in plain terms what generative AI tools do and where they tend to make mistakes."},
       {id:"aw2",type:"l",text:"I know which AI tools my organization has approved for work use."},
       {id:"aw3",type:"m",text:"Which statement best describes how a generative AI chatbot produces an answer?",opts:[["It looks the answer up in a verified database",1],["It predicts likely text from patterns in its training data, so it can sound fluent and still be wrong",5],["It copies answers written by human experts",1],["I am not sure",2]]}],
   barrier:"Limited understanding of what AI tools can and cannot do.",training:"AI fundamentals (1–2 hours): how generative AI works, its limits, and the approved-tools list.",action:"Read the approved-tools list and try each tool once on a low-risk task.",team:"Run a 60-minute AI fundamentals session and publish the approved-tools list."},
  {id:"at",name:"Attitude and willingness",short:"Attitude",basis:"ADKAR Desire",w:10,why:"How open are you to changing parts of your work with AI?",rationale:"Without desire, training does not convert into use.",
   qs:[{id:"at1",type:"l",text:"I am interested in using AI to change how I do parts of my job."},
       {id:"at2",type:"l",rev:true,text:"I worry that using AI at work will reduce the value of my role."},
       {id:"at3",type:"m",text:"If your team piloted a new AI tool next month, what would you most likely do?",opts:[["Volunteer to try it early",5],["Try it once others have shared results",4],["Use it only if required",2],["Avoid it if possible",1]]}],
   barrier:"Low motivation, or concern about how AI affects the role.",training:"A 1:1 with your manager on how AI fits your role, plus a peer demo session.",action:"Watch two colleagues use AI on tasks like yours and pick one task you would hand off.",team:"Leaders share real AI wins and address job-impact concerns openly in team meetings."},
  {id:"sk",name:"Practical AI skills",short:"Skills",basis:"ADKAR Knowledge",w:12,why:"Can you operate AI tools on your own for everyday tasks?",rationale:"Core capability that sets the ceiling on everything else.",
   qs:[{id:"sk1",type:"l",text:"I can use at least one AI tool to draft, summarize or analyze content without help."},
       {id:"sk2",type:"l",text:"I know how to give an AI tool context (documents, examples, constraints) to improve its output."},
       {id:"sk3",type:"m",text:"Which is the most advanced thing you have done with an AI tool?",opts:[["None of these",1],["Asked it simple questions",2],["Drafted or summarized documents",3],["Analyzed data or files I uploaded",4],["Built a reusable workflow, template or automation",5]]}],
   barrier:"Limited hands-on skill with AI tools.",training:"Hands-on lab: drafting, summarizing and analyzing files with the approved tool.",action:"Complete three guided exercises using your own non-sensitive work material.",team:"Hands-on labs with the approved tool, using real non-sensitive work."},
  {id:"pv",name:"Prompting and verification",short:"Prompt/verify",basis:"ADKAR Ability",w:12,why:"Can you steer AI to a good answer, and do you check what it gives you?",rationale:"Quality and accuracy of output depend on it, and it carries a direct error risk.",
   qs:[{id:"pv1",type:"l",text:"When an AI answer is not good enough, I know how to rephrase or add instructions to improve it."},
       {id:"pv2",type:"l",text:"I check facts, figures and sources in AI output before I use it."},
       {id:"pv3",type:"m",scenario:true,text:"An AI tool gives you a market statistic with a source link for a client report. What do you do?",opts:[["Use it as given, since it has a source",1],["Use it and label it as AI-generated",2],["Open the source and confirm it says what the AI claims",5],["Ask the AI whether it is sure",2]]}],
   barrier:"Weak prompting and output-checking habits.",training:"Prompting and verification workshop: context, examples, constraints and fact-checking.",action:"Use a prompt template for a week and verify every figure against its source.",team:"Prompting and verification workshop; add a verified-by step to deliverable checklists."},
  {id:"rf",name:"Role and use-case fit",short:"Role fit",basis:"Role fit",w:10,why:"Can you see where AI fits into the work you actually do?",rationale:"Readiness only matters where AI fits the work.",
   qs:[{id:"rf1",type:"l",text:"I can name at least two recurring tasks in my role where AI could save time or improve quality."},
       {id:"rf2",type:"l",text:"My main tasks include work AI handles well, such as writing, summarizing, research, analysis, coding or data preparation."},
       {id:"rf3",type:"m",text:"How much of your weekly work could realistically be assisted by AI today?",opts:[["Almost none",1],["Under 10%",2],["10–25%",3],["25–50%",4],["Over 50%",5]]}],
   barrier:"Unclear where AI fits in the role.",training:"Use-case mapping session with your manager.",action:"List your ten most frequent tasks and mark which ones AI could assist.",team:"Use-case mapping per role, collected into a shared use-case library."},
  {id:"pr",name:"Data privacy and responsible AI",short:"Privacy",basis:"OECD · NIST AI RMF",w:14,why:"Do you know what data must stay out of AI tools, and where AI needs human judgement?",rationale:"Highest weight: the main source of organizational risk, and a gate on safe scaling.",
   qs:[{id:"pr1",type:"l",text:"I know what types of company or customer data I must not enter into public AI tools."},
       {id:"pr2",type:"l",text:"I know our AI usage policy, or who to ask about it."},
       {id:"pr3",type:"m",scenario:true,text:"You need to summarize a spreadsheet of customer names, emails and purchase history. Which approach is appropriate?",opts:[["Paste it into any free AI chatbot",1],["Remove personal data first, or use only a tool approved for this data",5],["Paste it in, then delete the chat afterwards",1],["Ask a colleague to do it instead",2]]},
       {id:"pr4",type:"m",scenario:true,text:"An AI tool produces a shortlist of job candidates. What is the main responsible-AI concern?",opts:[["It may be slower than doing it by hand",1],["It may reflect bias in its data, so a person must review and own the decision",5],["The formatting may be inconsistent",1],["The licence cost",1]]}],
   barrier:"Gaps in data-privacy and responsible-AI knowledge.",training:"Mandatory: AI usage policy and data-classification module.",action:"Complete the AI usage-policy module before any further AI use with company data.",team:"Make the AI usage-policy module mandatory before tool access; publish a data do and don't card."},
  {id:"ac",name:"Access and organizational support",short:"Access",basis:"ADKAR Reinforcement · org readiness",w:10,why:"Do you have approved tools, encouragement and someone to ask?",rationale:"Structural enabler; low scores point to the organization, not the person.",
   qs:[{id:"ac1",type:"l",text:"I have access to at least one company-approved AI tool for my work."},
       {id:"ac2",type:"l",text:"My manager encourages me to try AI for work tasks."},
       {id:"ac3",type:"l",text:"I have access to training, guidance or a go-to person for AI questions."}],
   barrier:"Missing tool access or manager support.",training:"Request an approved tool licence and agree AI goals with your manager.",action:"Raise a tool-access request and agree one AI goal with your manager.",team:"Close licence gaps and ask managers to set one AI goal per person."},
  {id:"cf",name:"Confidence without over-reliance",short:"Confidence",basis:"OECD critical thinking",w:8,why:"Are you confident using AI while keeping your own judgement in charge?",rationale:"Balances confidence against blind trust in AI output.",
   qs:[{id:"cf1",type:"l",text:"I feel confident using AI tools in front of colleagues or clients."},
       {id:"cf2",type:"l",rev:true,text:"I sometimes use AI output in my work without fully understanding it."},
       {id:"cf3",type:"m",scenario:true,text:"If AI tools were unavailable for a week, how would your work be affected?",opts:[["I could not do key parts of my job",1],["Noticeably slower, but I would manage",4],["Little impact: AI assists my skills rather than replacing them",5],["No impact, because I do not use AI",2]]}],
   barrier:"Low confidence, or a risk of over-relying on AI output.",training:"Critical thinking with AI: when to trust, check or skip it.",action:"For each AI-assisted task, write one line on what you checked and what you changed.",team:"Teach when to trust, check or skip AI; review AI-assisted work in 1:1s."},
  {id:"ap",name:"Applying AI to real work",short:"Apply",basis:"ADKAR Ability",w:10,why:"Is AI already part of real deliverables, not just experiments?",rationale:"The behaviour that creates value.",
   qs:[{id:"ap1",type:"l",text:"I have used AI to help complete a real work deliverable in the last month."},
       {id:"ap2",type:"l",text:"I can estimate how much time AI saves me on a typical task."},
       {id:"ap3",type:"m",text:"Which best describes your AI use at work?",opts:[["I do not use it",1],["I experiment occasionally",2],["I use it for a few specific tasks",3],["It is part of my regular workflow",4],["I have redesigned a process around it and share it with others",5]]}],
   barrier:"AI not yet applied to real deliverables.",training:"Pair with an AI champion on a live task.",action:"Deliver one real piece of work with AI help and record the time saved.",team:"Pair low-application staff with AI champions on live deliverables."},
  {id:"ln",name:"Continuous learning",short:"Learning",basis:"ADKAR Reinforcement",w:6,why:"Do you keep building AI skills as the tools change?",rationale:"Keeps readiness from going stale; lower weight because it is a habit, not a capability.",
   qs:[{id:"ln1",type:"l",text:"In the last three months I have spent time learning a new AI skill or feature."},
       {id:"ln2",type:"l",text:"I share AI tips or examples with colleagues."},
       {id:"ln3",type:"m",text:"How do you keep up with changes in AI tools?",opts:[["I do not, currently",1],["When someone shows me",2],["Occasional articles or videos",3],["Regular courses or practice",4],["Regular practice, and I teach others",5]]}],
   barrier:"No regular learning habit for AI.",training:"Join an AI community of practice; protect 30 minutes a week for practice.",action:"Block 30 minutes for AI practice and share one tip with your team.",team:"Start a fortnightly AI community of practice with 30 minutes of protected practice time."}
];

function qScore(q){

function computeResult(){
  const p=S.profile;
  const scores = DIMS.map(d=>({d,score:dimScore(d)}));
  const raw = Math.round(scores.reduce((a,x)=>a+x.score*x.d.w,0)/100);
  const asc = scores.slice().sort((a,b)=>a.score-b.score);
  const desc = scores.slice().sort((a,b)=>b.score-a.score);
  const sv = id => qScore(qById(id));
  const flags=[];
  const pr3=sv("pr3"), ac1=sv("ac1"), pv3=sv("pv3");
  if(scores[5].score<50 || (pr3!==null&&pr3<5)) flags.push({key:"pr",title:"Data-handling risk",text:"Your answers suggest personal or confidential data could reach unapproved AI tools. Complete the AI usage-policy module before using AI with company data."});
  if((ac1!==null&&ac1<=2) || p.approval==="No") flags.push({key:"ac",title:"No approved tool access",text:"You report no approved AI tool or no manager approval. Raise an access request so that AI use happens on approved tools."});
  if(pv3!==null&&pv3<=2) flags.push({key:"pv",title:"Verification gap",text:"AI-generated facts and figures may be used without checking the original source."});
  if(scores[7].score<45) flags.push({key:"cf",title:"Over-reliance risk",text:"Your confidence and dependence answers suggest AI output may be used without full understanding."});
  const capped = flags.some(f=>f.key==="pr") && raw>GOV_CAP;
  const overall = capped ? GOV_CAP : raw;
  const level = levelOf(overall);
  const focus=[];
  flags.forEach(f=>{const d=DIMS.find(x=>x.id===f.key); if(d&&!focus.includes(d)) focus.push(d);});
  asc.forEach(x=>{ if(!focus.includes(x.d)) focus.push(x.d); });
  const plan = focus.slice(0,3).map((d,i)=>({week:"WEEK "+(i+1),focus:d.name,action:d.action}));
  plan.push({week:"WEEK 4",focus:"Apply and measure",action:"Use AI on one real task from start to finish, note the time saved and what you checked, and review it with your manager."});
  const who = p.anon ? S.rid : (p.name.trim()||S.rid);
  return {scores,overall,raw,capped,level,flags,plan,who,strengths:desc.slice(0,3),gaps:asc.slice(0,3),persona:personaOf(scores.map(x=>x.score),flags.map(f=>f.key))};
}
function radarSvg(scores){
  const N=scores.length, C=170, R=118, pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N; return [C+Math.cos(a)*R*v/100, C+Math.sin(a)*R*v/100];};
  const ring=v=>scores.map((_,i)=>pt(i,v).join(",")).join(" ");
  const poly=scores.map((x,i)=>pt(i,x.score).join(",")).join(" ");
  const label=(x,i)=>{const a=-Math.PI/2+i*2*Math.PI/N; const lx=C+Math.cos(a)*(R+22), ly=C+Math.sin(a)*(R+22); const anc=Math.abs(Math.cos(a))<0.2?"middle":(Math.cos(a)>0?"start":"end");
    return `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anc}" font-size="11" fill="var(--muted)">${x.d.short} ${x.score}</text>`;};
  const desc=scores.map(x=>`${x.d.name} ${x.score}`).join(", ");
  return `<svg viewBox="-80 0 500 340" role="img" aria-label="Radar chart of dimension scores: ${esc(desc)}" style="width:100%;max-width:540px;display:block;margin:0 auto">
    ${[25,50,75,100].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("")}
    ${scores.map((_,i)=>{const p=pt(i,100); return `<line x1="${C}" y1="${C}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)" stroke-width="1"/>`;}).join("")}
    <polygon points="${poly}" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    ${scores.map((x,i)=>{const p=pt(i,x.score); return `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${tone(x.score)}"/>`;}).join("")}
    ${scores.map(label).join("")}
  </svg>`;
}

  const deptRows=depts.map(d=>{const g=people.filter(p=>p.dept===d); return {d,n:g.length,avg:avgOf(g.map(p=>p.overall))};}).sort((a,b)=>b.avg-a.avg);
  const dimAvg=DIMS.map((dm,i)=>({dm,avg:avgOf(scope.map(p=>p.dims[i]))})).sort((a,b)=>a.avg-b.avg);
  const risks=TEAM_FLAGS.map(f=>{const who=scope.filter(p=>p.flags.includes(f.key)); return {f,who};}).sort((a,b)=>b.who.length-a.who.length);

  ];
  const rows=scope.slice().sort((a,b)=>b.overall-a.overall);
  return `<section class="stack">
  <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end">

}
function teamCsv(){
  const {scope}=teamData();
  const head=["id","source","department","role","seniority","ai_frequency","raw_score","overall","level"].concat(DIMS.map(d=>d.id)).concat(["flags"]);
  return [head.join(",")].concat(scope.map(p=>[p.id,p.source,p.dept,p.role,p.sen,p.freq,p.raw,p.overall,p.level].concat(p.dims).concat([p.flags.join("; ")]).map(csvCell).join(","))).join("\n");
}

/* ---------------- Method ---------------- */
function scoringText(q){
  if(q.type==="l") return q.rev ? "Reverse: 6 − answer" : "1–5";
  return q.opts.map(o=>`${o[0]} [${o[1]}]`).join(" · ");
}

/* ---------------- Local storage (this browser only) ---------------- */
const HIST_KEY="aiReadinessHistory.v1", SCEN_KEY="aiReadinessScenarios.v1", WS_KEY="aiReadinessWorkshop.v1";
const lsGet=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } };
const validDims = a => Array.isArray(a) && a.length===DIMS.length && a.every(n=>typeof n==="number" && n>=0 && n<=100);
let HIST = lsGet(HIST_KEY,[]); if(!Array.isArray(HIST)) HIST=[]; HIST=HIST.filter(h=>h&&validDims(h.dims));
let SCEN = lsGet(SCEN_KEY,[]); if(!Array.isArray(SCEN)) SCEN=[]; SCEN=SCEN.filter(x=>x&&validDims(x.sim));
let WS = lsGet(WS_KEY,{session:"",participants:[]}); if(!WS||!Array.isArray(WS.participants)) WS={session:"",participants:[]}; WS.participants=WS.participants.filter(x=>x&&validDims(x.dims));
const dimIdx = id => DIMS.findIndex(d=>d.id===id);
const overallOf = (dims, flags) => { const raw=Math.round(dims.reduce((a,v,i)=>a+v*DIMS[i].w,0)/100); return (flags||[]).includes("pr") ? Math.min(raw,GOV_CAP) : raw; };
const fmtDate = iso => { try{ return new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }catch(e){ return iso; } };

/* ---------------- Persona ---------------- */
function personaOf(dims, flags){
  const v=id=>dims[dimIdx(id)];
  const cap=avgOf([v("sk"),v("pv"),v("ap")]);
  const overall=Math.round(dims.reduce((a,x,i)=>a+x*DIMS[i].w,0)/100);
  const spread=Math.max(...dims)-Math.min(...dims);
  const lowest=DIMS[dims.indexOf(Math.min(...dims))].id;
  const P=(name,tagline,desc,focus)=>({name,tagline,desc,focus,focusName:DIMS[dimIdx(focus)].name});
  if(((flags||[]).includes("pr")||v("pr")<50) && cap>=65) return P("Fast Mover, Loose Guardrails","Gets real value from AI, but data handling needs tightening first.","You already get real value from AI. The risk is that personal or confidential data reaches tools that are not approved for it. Fixing this protects you and lifts the cap on your score.","pr");
  if(overall>=85 && Math.min(...dims)>=60) return P("Multiplier","Skilled, safe, and ready to bring others along.","You use AI skilfully and safely across the board. Your biggest contribution now is helping colleagues: share prompts, run demos and act as a go-to person.","ln");
  if(v("ac")<45 && v("at")>=60) return P("Blocked Enthusiast","Keen to use AI, held back by access or support.","You want to use AI, but tool access or support is holding you back. Solving access is the fastest way to turn motivation into results.","ac");
  if(v("at")>=75 && cap<55) return P("Eager Explorer","High motivation, with skills still catching up.","Your motivation is high, but hands-on skills have not caught up yet. Structured practice on real tasks will turn enthusiasm into results quickly.","sk");
  if(cap>=65 && v("cf")<50) return P("Power User, Check the Brakes","Uses AI heavily; keep your own judgement in charge.","You use AI a lot and get results. Make sure your own judgement stays in charge: check outputs and keep core skills sharp.","cf");
  if(cap>=70 && v("at")<55) return P("Sceptical Expert","Capable with AI, unconvinced it is worth it.","You can use AI well but are not convinced it pays off in your work. Finding one or two high-value use cases in your role may change that.","rf");
  if(v("pr")>=75 && cap<55) return P("Careful Starter","Knows the rules, rarely uses AI on real work.","You know the rules and handle data carefully, but rarely apply AI to real work. Pick one low-risk deliverable and try it end to end.","ap");
  if(overall<40) return P("Getting Started","Early in the journey, foundations still to build.","You are early in the AI journey. Start with the basics: what the tools can do, which ones are approved, and one simple task to try.","aw");
  if(spread<=25 && overall>=50 && overall<75) return P("Steady Builder","Balanced across the board, ready to go deeper.","Your scores are balanced with no major gaps. The next step is depth: make AI a routine part of a few key tasks.","ap");
  return P("Developing Practitioner","Clear strengths, with a few gaps to close.","You have clear strengths and a few gaps. Focus on the area below to make the biggest difference.",lowest);
}

/* ---------------- Radar with overlays ---------------- */
function radarMulti(series, title){
  const N=DIMS.length, C=170, R=118, pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N; return [C+Math.cos(a)*R*v/100, C+Math.sin(a)*R*v/100];};
  const ring=v=>DIMS.map((_,i)=>pt(i,v).join(",")).join(" ");
  const one = series.length===1;
  const label=(d,i)=>{const a=-Math.PI/2+i*2*Math.PI/N; const lx=C+Math.cos(a)*(R+22), ly=C+Math.sin(a)*(R+22); const anc=Math.abs(Math.cos(a))<0.2?"middle":(Math.cos(a)>0?"start":"end");
    return `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anc}" font-size="11" fill="var(--muted)">${d.short}${one?" "+series[0].vals[i]:""}</text>`;};
  const desc=series.map(s=>`${s.label}: `+DIMS.map((d,i)=>`${d.name} ${s.vals[i]}`).join(", ")).join(". ");
  return `<svg viewBox="-80 0 500 340" role="img" aria-label="${esc(title)}. ${esc(desc)}" style="width:100%;max-width:540px;display:block;margin:0 auto">
    ${[25,50,75,100].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("")}
    ${DIMS.map((_,i)=>{const p=pt(i,100); return `<line x1="${C}" y1="${C}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)" stroke-width="1"/>`;}).join("")}
    ${series.map(s=>`<polygon points="${s.vals.map((v,i)=>pt(i,v).join(",")).join(" ")}" fill="${s.color}" fill-opacity="${s.fill==null?0.15:s.fill}" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="6 4"':""}/>`).join("")}
    ${series.map(s=>s.vals.map((v,i)=>{const p=pt(i,v); return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${s.color}"/>`;}).join("")).join("")}
    ${DIMS.map(label).join("")}
  </svg>`;
}
function seriesLegend(series){ return `<div class="legendrow" style="justify-content:center;margin-top:6px">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}${s.dash?" (dashed)":""}</span>`).join("")}</div>`; }

}
function trendSvg(){
  const pts=HIST, W=640, H=220, L=40, Rm=16, T=16, B=34, n=pts.length;

/* ---------------- What-if simulator ---------------- */
function simProjection(){
  const r=computeResult(), real=r.scores.map(x=>x.score), sim=S.sim, pi=dimIdx("pr");
  const raw=Math.round(sim.reduce((a,v,i)=>a+v*DIMS[i].w,0)/100);
  const capOn = sim[pi]<50 || (r.flags.some(f=>f.key==="pr") && sim[pi]<=real[pi]);
  const overall = capOn ? Math.min(raw,GOV_CAP) : raw;
  return {r, real, raw, overall, capOn, level:levelOf(overall)};
}

  ac:["Who still lacks access to an approved tool?","What would help managers actively encourage AI use?","Where should people take their AI questions?"],
  cf:["When should we trust, check or skip AI output?","How do we keep core skills sharp while using AI?","What should a reviewer look for in AI-assisted work?"],
  ap:["What real deliverable could each person try with AI this month?","How will we measure time saved?","Which wins should we share at the next team meeting?"],
  ln:["How do we protect time for practice?","Should we start a community of practice?","How do we share tips without adding meetings?"]
};
const b64u = str => btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = s => { let b=s.replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="="; return decodeURIComponent(escape(atob(b))); };
function wsCode(){ const r=computeResult(); return "AIR1-"+b64u(JSON.stringify({v:1,i:S.rid,d:S.profile.dept,s:r.scores.map(x=>x.score),f:r.flags.map(f=>f.key)})); }
function parseCodes(text){
  const out=[];
  (String(text).match(/AIR1-[A-Za-z0-9_-]{10,600}/g)||[]).forEach(c=>{ try{ const o=JSON.parse(unb64u(c.slice(5)));
    if(o&&o.v===1&&validDims(o.s)) out.push({id:String(o.i||"?").slice(0,16),dept:String(o.d||"").slice(0,40),dims:o.s.map(Math.round),flags:Array.isArray(o.f)?o.f.filter(k=>["pr","ac","pv","cf"].includes(k)):[]}); }catch(e){} });
  return out;
}
function joinUrl(){ return location.origin+location.pathname+(WS.session?"?session="+encodeURIComponent(WS.session):"")+"#assess"; }
function qrSvg(text){ try{ const q=qrcode(0,"M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:6,margin:2,scalable:true,alt:"QR code for the assessment link"}); }catch(e){ return ""; } }
function wsStats(){
  const P=WS.participants.map(x=>({...x, overall:overallOf(x.dims,x.flags)}));
  const n=P.length, avgDims=DIMS.map((_,i)=>avgOf(P.map(x=>x.dims[i])));
  const order=DIMS.map((d,i)=>({d,i,avg:avgDims[i],low:P.filter(x=>x.dims[i]<50).length,mid:P.filter(x=>x.dims[i]>=50&&x.dims[i]<75).length,high:P.filter(x=>x.dims[i]>=75).length}));
  const sorted=order.slice().sort((a,b)=>a.avg-b.avg);
  let cards=sorted.filter(x=>x.avg<60).slice(0,4); if(!cards.length) cards=sorted.slice(0,3);
  return {P,n,avgDims,order,cards,avg:avgOf(P.map(x=>x.overall)),flagged:P.filter(x=>x.flags.length).length};
}
function wsCardsText(){ const st=wsStats(); return `AI readiness workshop${WS.session?" · "+WS.session:""} · ${st.n} participants · average ${st.avg}\n\n`+st.cards.map(c=>`${c.d.name} · team average ${c.avg} · ${c.low} of ${st.n} below 50\n`+TALK[c.d.id].map(t=>"- "+t).join("\n")).join("\n\n"); }
function viewWorkshop(){
  const st=wsStats(), url=joinUrl();
  const setup=`<div class="grid wide noprint" style="align-items:start">
    <div class="card"><h2>1 · Invite participants</h2>
      <div class="field" style="margin-bottom:14px"><label for="wsSession">Session name</label><input id="wsSession" data-ws="session" value="${esc(WS.session)}" maxlength="40" placeholder="e.g. Marketing team, March"></div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center"><div style="background:#fff;padding:8px;border-radius:10px;width:180px;height:180px" id="wsQr">${qrSvg(url)}</div>
      <div style="flex:1;min-width:200px"><p style="margin:0 0 8px">Participants scan the code or open:</p><code style="display:block;margin-bottom:10px">${esc(url)}</code>
      <p style="margin:0;color:var(--muted);font-size:14px">They complete the assessment, then copy the workshop code on their results page and paste it into the meeting chat. Codes carry only an anonymous ID, department and scores.</p></div></div></div>
    <div class="card"><h2>2 · Collect codes</h2>
      <div class="field"><label for="wsPaste">Paste codes (any amount of chat text is fine)</label><textarea id="wsPaste" rows="5" placeholder="AIR1-…"></textarea></div>
      <div class="btnrow" style="margin-top:12px"><button class="btn" id="wsAdd">Add codes</button>${st.n?`<button class="btn ghost" id="wsClear">Remove all participants</button>`:""}</div>
      ${S.wsMsg?`<p role="status" style="margin:10px 0 0;color:var(--accent)">${esc(S.wsMsg)}</p>`:""}
      ${st.n?`<div class="chips" style="margin-top:14px">${st.P.map(x=>`<button type="button" class="opt chip" data-wsdel="${esc(x.id)}" aria-label="Remove participant ${esc(x.id)}">${esc(x.id)}${x.dept?" · "+esc(x.dept):""} ✕</button>`).join("")}</div>`:""}
    </div></div>`;
  const head=`<div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end"><div><div class="eyebrow" style="color:var(--accent)">Facilitator view</div><h1 class="page">Workshop${WS.session?": "+esc(WS.session):" mode"}</h1></div>
    <button type="button" class="opt chip dark noprint" id="wsProj" aria-pressed="${!!S.wsProjector}">Projector mode</button></div>`;
  if(!st.n) return `<section class="stack">${head}${setup}<div class="card noprint"><p style="margin:0">No participants yet. Team results appear here once you add codes.</p></div></section>`;
  const avgSeries={vals:st.avgDims,color:"var(--accent)",label:"Team average"};
  return `<section class="stack">${head}${setup}
  ${st.n<5?`<div class="flags noprint"><p style="margin:0"><strong>Fewer than 5 participants</strong>With so few people, individual results may be easy to identify. Consider waiting for more codes before projecting.</p></div>`:""}
  <div class="grid noprint" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    <div class="card kpi"><div class="l">Participants</div><div class="v">${st.n}</div></div>
    <div class="card kpi"><div class="l">Average readiness</div><div class="v">${st.avg}</div><div style="font-size:14px;font-weight:500">${levelOf(st.avg).name}</div></div>
    <div class="card kpi warn"><div class="l">With a critical gap</div><div class="v">${st.flagged}</div><div class="l">${pct(st.flagged,st.n)}</div></div>
    <div class="card kpi"><div class="l">Lowest area</div><div style="font-size:20px;font-weight:600;margin-top:6px">${st.cards[0].d.name}</div><div class="l">avg ${st.cards[0].avg}</div></div></div>
  <div class="grid wide noprint" style="align-items:start">
    <div class="card"><h2>Team average profile</h2>${radarMulti([avgSeries],"Team average scores")}</div>
    <div class="card"><h2>How people spread in each area</h2>
      ${st.order.map(o=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:15px"><span>${o.d.name}</span><span class="mono" style="font-size:13px;color:var(--muted)">Low ${o.low} · Mid ${o.mid} · High ${o.high}</span></div>
        <div style="display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--track);margin-top:4px">${[["low","var(--s-gap)"],["mid","var(--s-mid)"],["high","var(--s-strong)"]].map(([k,c])=>o[k]?`<span style="width:${o[k]/st.n*100}%;background:${c};box-shadow:inset -1px 0 0 var(--surface)"></span>`:"").join("")}</div></div>`).join("")}
      <div class="legendrow"><span><i style="background:var(--s-gap)"></i>Low (below 50)</span><span><i style="background:var(--s-mid)"></i>Mid (50–74)</span><span><i style="background:var(--s-strong)"></i>High (75+)</span></div></div></div>
  <div class="card"><h2>Discussion cards</h2><p class="noprint" style="margin:0 0 14px;color:var(--muted);font-size:14px">The areas where the team scored lowest, with questions to open the conversation.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
    ${st.cards.map(c=>`<div class="dcard"><div class="mono" style="font-size:13px;color:var(--warn-tx);font-weight:600">TEAM AVERAGE ${c.avg} · ${c.low} OF ${st.n} BELOW 50</div><div style="font-size:20px;font-weight:600;margin:6px 0 10px">${c.d.name}</div><ul class="clean">${TALK[c.d.id].map(t=>`<li>${t}</li>`).join("")}</ul></div>`).join("")}
    </div>
    <div class="btnrow noprint" style="margin-top:16px"><button class="btn" id="wsCopy">Copy cards as text</button><button class="btn ghost" id="wsPrint">Print cards</button><button class="btn ghost" id="wsCsv">Download results (CSV)</button></div>
  </div></section>`;
}
function wsCsv(){
  const P=wsStats().P, head=["participant_id","department","overall","level"].concat(DIMS.map(d=>d.id)).concat(["flags"]);
  return [head.join(",")].concat(P.map(x=>[x.id,x.dept,x.overall,levelOf(x.overall).name].concat(x.dims).concat([x.flags.join("; ")]).map(csvCell).join(","))).join("\n");
}
async function copyText(text){ try{ await navigator.clipboard.writeText(text); return true; }catch(e){ try{ const t=document.createElement("textarea"); t.value=text; t.style.position="fixed"; t.style.left="-9999px"; document.body.appendChild(t); t.select(); const ok=document.execCommand("copy"); t.remove(); return ok; }catch(e2){ return false; } } }

/* ---------------- Render and events ---------------- */
const app = document.getElementById("app");
function render(){
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.tab===S.tab?"page":"false"));
  const prog=document.getElementById("progress");
  prog.style.display = S.tab==="assess" ? "flex" : "none";
  const answered=Object.keys(S.ans).length;
  document.getElementById("pbar").style.width = (S.step===11?100:Math.round(answered/TOTAL_Q*100))+"%";
  document.getElementById("plbl").textContent = S.step===0?"Profile":(S.step===11?"Complete":`${answered} / ${TOTAL_Q} answered`);
  document.body.classList.toggle("projector", S.tab==="workshop" && !!S.wsProjector);
  if(S.tab==="team") app.innerHTML=viewTeam();
  else if(S.tab==="method") app.innerHTML=viewMethod();
  else if(S.tab==="history") app.innerHTML=viewHistory();
  else if(S.tab==="workshop") app.innerHTML=viewWorkshop();
  else if(S.step===11) app.innerHTML = S.sub==="report"?viewReport():(S.sub==="sim"&&S.sim?viewSim():viewResult());
  else app.innerHTML = S.step===0?viewIntro():viewDim();
}
function keepScroll(fn){ const y=window.scrollY; fn(); render(); window.scrollTo(0,y); }
function go(step){ S.step=step; render(); window.scrollTo(0,0); }
function updateStart(){ const b=document.getElementById("start"); if(b) b.disabled=!profileDone(); }

app.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.sim!==undefined){ const i=+t.dataset.sim; S.sim[i]=+t.value; const v=document.getElementById("simv-"+i); if(v) v.textContent=t.value; const o=document.getElementById("simOut"); if(o) o.innerHTML=simOutHtml(); return; }
  if(t.dataset.ws==="session"){ WS.session=t.value.slice(0,40); lsSet(WS_KEY,WS); const q=document.getElementById("wsQr"); if(q) q.innerHTML=qrSvg(joinUrl()); const c=q&&q.parentElement.querySelector("code"); if(c) c.textContent=joinUrl(); return; }
  const k=t.dataset.p; if(!k) return;
  S.profile[k]=t.value; updateStart();
});
app.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.lock!==undefined){ const i=+t.dataset.lock; S.locks[i]=t.checked; if(t.checked) S.sim[i]=computeResult().scores[i].score; keepScroll(()=>{}); return; }
  if(t.dataset.hsel!==undefined){ const id=t.dataset.hsel; S.histSel = t.checked ? S.histSel.concat([id]).slice(-2) : S.histSel.filter(x=>x!==id); keepScroll(()=>{}); return; }
  if(t.dataset.hlabel!==undefined){ const h=HIST.find(x=>x.id===t.dataset.hlabel); if(h){ h.label=t.value.slice(0,40); lsSet(HIST_KEY,HIST); } return; }
  if(t.id==="histImport" && t.files && t.files[0]){ importHistory(t.files[0]); return; }
  if(e.target.id==="anon"){ S.profile.anon=e.target.checked; render(); return; }
  const k=e.target.dataset.p; if(k){ S.profile[k]=e.target.value; updateStart(); }
});
app.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.tool){
    const tool=t.dataset.tool; let list=S.profile.tools.slice();
    if(list.includes(tool)) list=list.filter(x=>x!==tool);
    else if(tool==="None yet") list=["None yet"];
    else { list=list.filter(x=>x!=="None yet"); list.push(tool); }
    S.profile.tools=list;
    app.querySelectorAll("[data-tool]").forEach(b=>b.setAttribute("aria-pressed", list.includes(b.dataset.tool)));
    return;
  }
  if(t.dataset.q){
    S.ans[t.dataset.q]=+t.dataset.k;
    const y=window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if(t.dataset.dept){ S.teamDept=t.dataset.dept; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.hdel){ keepScroll(()=>{ HIST=HIST.filter(h=>h.id!==t.dataset.hdel); S.histSel=S.histSel.filter(x=>x!==t.dataset.hdel); if(S.runId===t.dataset.hdel) S.runId=null; lsSet(HIST_KEY,HIST); S.histMsg="Assessment deleted."; }); return; }
  if(t.dataset.scenLoad){ const x=SCEN.find(s=>s.id===t.dataset.scenLoad); if(x) keepScroll(()=>{ S.sim=x.sim.slice(); S.locks={}; S.simMsg=`Loaded ${x.name}.`; }); return; }
  if(t.dataset.scenDel){ keepScroll(()=>{ SCEN=SCEN.filter(s=>s.id!==t.dataset.scenDel); lsSet(SCEN_KEY,SCEN); S.simMsg="Scenario deleted."; }); return; }
  if(t.dataset.wsdel){ keepScroll(()=>{ WS.participants=WS.participants.filter(x=>x.id!==t.dataset.wsdel); lsSet(WS_KEY,WS); S.wsMsg="Participant removed."; }); return; }
  switch(t.id){
    case "start": S.isSample=false; S.runId=null; go(1); break;
    case "sample": fillSample(); S.isSample=true; S.sub="result"; render(); window.scrollTo(0,0); break;
    case "back": go(S.step-1); break;
    case "next": if(S.step===10){ S.sub="result"; S.step=11; recordHistory(); render(); window.scrollTo(0,0); } else go(S.step+1); break;
    case "review": S.sub="result"; go(1); break;
    case "restart": S.ans={}; S.profile=emptyProfile(); S.rid=newId(); S.savedMsg=""; S.runId=null; S.isSample=false; S.sub="result"; S.sim=null; S.locks={}; S.showCode=false; S.codeMsg=""; go(0); break;
    case "report": S.sub="report"; render(); window.scrollTo(0,0); break;
    case "print": window.print(); break;
    case "share": shareImage(); break;
    case "sim": S.sim=computeResult().scores.map(x=>x.score); S.locks={}; S.simMsg=""; S.sub="sim"; render(); window.scrollTo(0,0); break;
    case "toResult": S.sub="result"; render(); window.scrollTo(0,0); break;
    case "simReset": keepScroll(()=>{ S.sim=computeResult().scores.map(x=>x.score); S.locks={}; S.simMsg="Reset to current scores."; }); break;
    case "simSave": keepScroll(()=>{ const pj=simProjection(); const mine=SCEN.filter(x=>x.rid===S.rid); const num=(mine.length?Math.max(...mine.map(x=>x.num||0)):0)+1;
      const rec={id:"S"+Date.now().toString(36), rid:S.rid, num, name:"Scenario "+num, sim:S.sim.slice(), overall:pj.overall, ts:new Date().toISOString()};
      let keep=mine.concat([rec]); let dropped=""; if(keep.length>3){ dropped=` ${keep[0].name} was removed to keep the 3 most recent.`; keep=keep.slice(-3); }
      SCEN=SCEN.filter(x=>x.rid!==S.rid).concat(keep); lsSet(SCEN_KEY,SCEN); S.simMsg=`Saved ${rec.name}.${dropped}`; }); break;
    case "showCode": keepScroll(()=>{ S.showCode=true; }); break;
    case "copyCode": copyText(wsCode()).then(ok=>keepScroll(()=>{ S.codeMsg = ok ? "Copied." : "Select the code and copy it manually."; })); break;
    case "histExport": download("ai-readiness-history.json", JSON.stringify({exported:new Date().toISOString(),history:HIST},null,2)); break;
    case "histClear": if(confirm("Delete all saved assessments in this browser? This cannot be undone.")) keepScroll(()=>{ HIST=[]; S.histSel=[]; S.runId=null; lsSet(HIST_KEY,HIST); S.histMsg="History deleted."; }); break;
    case "wsAdd": { const box=document.getElementById("wsPaste"); const found=parseCodes(box?box.value:""); keepScroll(()=>{ let added=0, upd=0; found.forEach(x=>{ const i=WS.participants.findIndex(p=>p.id===x.id); if(i>=0){ WS.participants[i]=x; upd++; } else { WS.participants.push(x); added++; } }); lsSet(WS_KEY,WS);
      S.wsMsg = found.length ? `Added ${added} participant${added===1?"":"s"}${upd?`, updated ${upd}`:""}.` : "No valid codes found. Codes start with AIR1-."; }); break; }
    case "wsClear": if(confirm("Remove all workshop participants?")) keepScroll(()=>{ WS.participants=[]; lsSet(WS_KEY,WS); S.wsMsg="All participants removed."; }); break;
    case "wsProj": keepScroll(()=>{ S.wsProjector=!S.wsProjector; }); break;
    case "wsCopy": copyText(wsCardsText()).then(ok=>keepScroll(()=>{ S.wsMsg = ok ? "Discussion cards copied as text." : "Copy failed in this browser; use Print cards instead."; })); break;
    case "wsPrint": window.print(); break;
    case "wsCsv": download("ai-readiness-workshop.csv", wsCsv()); break;
    case "save": addToRoster(); { const y=window.scrollY; render(); window.scrollTo(0,y); } break;
    case "toggleSample": S.includeSample=!S.includeSample; render(); break;
    case "clearRoster": ROSTER=[]; saveRoster(ROSTER); S.savedMsg=""; render(); break;
    case "dl": download(`ai-readiness-${computeResult().who}.csv`, resultCsv()); break;
    case "teamdl": download("ai-readiness-team.csv", teamCsv()); break;
  }
});
function fromHash(){ const h=location.hash.replace("#",""); S.tab=["assess","history","workshop","team","method"].includes(h)?h:"assess"; render(); }
window.addEventListener("hashchange", ()=>{ fromHash(); window.scrollTo(0,0); });
fromHash();
</script>
</body>
