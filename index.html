<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Readiness Calculator</title>
<meta name="description" content="Employee AI readiness self-assessment with personal report, team dashboard and method.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ground:#F3F5F7;--surface:#FFFFFF;--ink:#101828;--ink2:#344054;--muted:#475467;--line:#D0D5DD;--line2:#EAECF0;--field:#98A2B3;

  --s-gap:#C4540A;--s-mid:#5B82D6;--s-strong:#1E3A8A;--head:#101828;--head-tx:#FFFFFF;--head-sub:#D0D5DD;--track:#EAECF0;--chip-on:#101828;--chip-on-tx:#FFFFFF;--tile:#F3F5F7;--th:#F9FAFB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B111C;--surface:#121A28;--ink:#F2F4F7;--ink2:#D0D5DD;--muted:#A6B0C0;--line:#2B3546;--line2:#222C3B;--field:#56637A;
    --accent:#5B8DEF;--accent-dk:#9DB8F2;--warn:#F08A4B;--warn-tx:#F7B98E;--warn-bg:#2A1A10;--warn-bd:#6B3A1C;
    --s-gap:#F08A4B;--s-mid:#6F95DD;--s-strong:#B9CDF5;--head:#060A12;--track:#222C3B;--chip-on:#F2F4F7;--chip-on-tx:#101828;--tile:#182233;--th:#172030;
  }
}
:root[data-theme="dark"]{
  --ground:#0B111C;--surface:#121A28;--ink:#F2F4F7;--ink2:#D0D5DD;--muted:#A6B0C0;--line:#2B3546;--line2:#222C3B;--field:#56637A;
  --accent:#5B8DEF;--accent-dk:#9DB8F2;--warn:#F08A4B;--warn-tx:#F7B98E;--warn-bg:#2A1A10;--warn-bd:#6B3A1C;
  --s-gap:#F08A4B;--s-mid:#6F95DD;--s-strong:#B9CDF5;--head:#060A12;--track:#222C3B;--chip-on:#F2F4F7;--chip-on-tx:#101828;--tile:#182233;--th:#172030;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--accent)}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
header.top{background:var(--head);color:var(--head-tx)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:18px 0}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.brand{font-size:20px;font-weight:600}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{color:var(--head-sub);text-decoration:none;padding:10px 14px;border-radius:8px;min-height:44px;display:inline-flex;align-items:center}
nav.tabs a[aria-current="page"]{background:#1F2A3D;color:#fff;font-weight:600}
.progress{display:flex;align-items:center;gap:12px;padding:0 0 16px}
.progress .bar{flex:1;height:6px;background:#344054;border-radius:3px;overflow:hidden}
.progress .bar span{display:block;height:6px;background:var(--soft)}
.progress .lbl{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--head-sub);white-space:nowrap}
main{padding:28px 0 72px}
.stack{display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.card h2{margin:0 0 14px;font-size:19px;font-weight:600}
h1.page{margin:0;font-size:32px;line-height:1.2;font-weight:600}
.lead{margin:0;color:var(--muted);font-size:17px;max-width:740px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.legend{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{min-height:44px;padding:8px 12px;border:1px solid var(--field);border-radius:8px;background:var(--surface);color:var(--ink)}
.anon{display:flex;gap:12px;align-items:flex-start;background:var(--tile);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.anon input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.anon small{display:block;color:var(--muted);font-size:14px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:46px;padding:10px 14px;border-radius:8px;border:1px solid var(--field);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{border-radius:22px;padding:8px 16px}
.chip.dark[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-tx)}
.likert{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mc{display:flex;flex-direction:column;gap:8px}
.q legend{font-size:17px;font-weight:500;margin-bottom:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btnrow.split{justify-content:space-between}
.btn{min-height:48px;padding:12px 24px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--field);font-weight:400}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{background:var(--head);color:#fff;border-radius:16px;padding:28px;display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:center}
.hero .big{font-family:'IBM Plex Mono',monospace;font-size:80px;font-weight:600;line-height:1}
.hero .sub{color:var(--head-sub)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale div span{display:block;height:14px;border-radius:4px;margin-bottom:6px}
.scale div.cur span{outline:2px solid #fff;outline-offset:2px}
.scale small{font-size:12px;line-height:1.3;color:var(--head-sub);display:block}
.scale div.cur small{color:#fff;font-weight:600}
.flags{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:14px;padding:22px}
.flags h2{margin:0 0 12px;font-size:18px;color:var(--warn-tx)}
.flags p{margin:0 0 10px;color:var(--ink2)}
.flags strong{color:var(--ink);display:block}
.barrow{display:grid;grid-template-columns:minmax(150px,2fr) minmax(100px,3fr) 48px;gap:14px;align-items:center;margin-bottom:12px}
.barrow small{display:block;font-size:12px;color:var(--muted)}
.track{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.track span{display:block;height:100%;border-radius:5px}
.num{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right}
.legendrow{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--muted)}
.legendrow i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.list-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line2);padding:8px 0}
.tile{background:var(--tile);border-radius:10px;padding:16px}
.tile .tag{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);font-weight:600;display:block}
.tile strong{display:block;margin:4px 0}
.tile p{margin:0;font-size:14px;color:var(--ink2)}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.kpi .v{font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:600;line-height:1.1}
.kpi .l{font-size:14px;color:var(--muted)}
.kpi.warn{background:var(--warn-bg);border-color:var(--warn-bd)}
.kpi.warn .l{color:var(--warn-tx)}
.tbl{overflow-x:auto;border:1px solid var(--line2);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--th);white-space:nowrap}
td.low{background:var(--warn-bg)}
code{font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--tile);padding:2px 6px;border-radius:4px;word-break:break-word}
.badge{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#101828;background:#FDE7D4;padding:6px 12px;border-radius:6px}
.phase{border-top:4px solid;background:var(--th);border-radius:0 0 10px 10px;padding:16px}
footer{color:var(--muted);font-size:13px;padding:0 0 40px}
@media (max-width:560px){.hero .big{font-size:64px}h1.page{font-size:26px}.barrow{grid-template-columns:1fr 44px}.barrow .track{grid-column:1/-1;grid-row:2}}
</style>
</head>

function qScore(q){
  const a = S.ans[q.id]; if(a===undefined) return null;

}
const qById = id => { for(const d of DIMS) for(const q of d.qs) if(q.id===id) return q; return null; };

function computeResult(){
  const p=S.profile;
  const scores = DIMS.map(d=>({d,score:dimScore(d)}));
  const raw = Math.round(scores.reduce((a,x)=>a+x.score*x.d.w,0)/100);
  const asc = scores.slice().sort((a,b)=>a.score-b.score);
  const desc = scores.slice().sort((a,b)=>b.score-a.score);
  const sv = id => qScore(qById(id));
  const flags=[];
  const pr3=sv("pr3"), ac1=sv("ac1"), pv3=sv("pv3");
  if(scores[5].score<50 || (pr3!==null&&pr3<5)) flags.push({key:"pr",title:"Data-handling risk",text:"Your answers suggest personal or confidential data could reach unapproved AI tools. Complete the AI usage-policy module before using AI with company data."});
  if((ac1!==null&&ac1<=2) || p.approval==="No") flags.push({key:"ac",title:"No approved tool access",text:"You report no approved AI tool or no manager approval. Raise an access request so that AI use happens on approved tools."});
  if(pv3!==null&&pv3<=2) flags.push({key:"pv",title:"Verification gap",text:"AI-generated facts and figures may be used without checking the original source."});
  if(scores[7].score<45) flags.push({key:"cf",title:"Over-reliance risk",text:"Your confidence and dependence answers suggest AI output may be used without full understanding."});
  const capped = flags.some(f=>f.key==="pr") && raw>GOV_CAP;
  const overall = capped ? GOV_CAP : raw;
  const level = levelOf(overall);
  const focus=[];
  flags.forEach(f=>{const d=DIMS.find(x=>x.id===f.key); if(d&&!focus.includes(d)) focus.push(d);});
  asc.forEach(x=>{ if(!focus.includes(x.d)) focus.push(x.d); });
  const plan = focus.slice(0,3).map((d,i)=>({week:"WEEK "+(i+1),focus:d.name,action:d.action}));
  plan.push({week:"WEEK 4",focus:"Apply and measure",action:"Use AI on one real task from start to finish, note the time saved and what you checked, and review it with your manager."});
  const who = p.anon ? S.rid : (p.name.trim()||S.rid);
  return {scores,overall,raw,capped,level,flags,plan,who,strengths:desc.slice(0,3),gaps:asc.slice(0,3)};
}
function radarSvg(scores){
  const N=scores.length, C=170, R=118, pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N; return [C+Math.cos(a)*R*v/100, C+Math.sin(a)*R*v/100];};
  const ring=v=>scores.map((_,i)=>pt(i,v).join(",")).join(" ");
  const poly=scores.map((x,i)=>pt(i,x.score).join(",")).join(" ");
  const label=(x,i)=>{const a=-Math.PI/2+i*2*Math.PI/N; const lx=C+Math.cos(a)*(R+22), ly=C+Math.sin(a)*(R+22); const anc=Math.abs(Math.cos(a))<0.2?"middle":(Math.cos(a)>0?"start":"end");
    return `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anc}" font-size="11" fill="var(--muted)">${x.d.short} ${x.score}</text>`;};
  const desc=scores.map(x=>`${x.d.name} ${x.score}`).join(", ");
  return `<svg viewBox="-80 0 500 340" role="img" aria-label="Radar chart of dimension scores: ${esc(desc)}" style="width:100%;max-width:540px;display:block;margin:0 auto">
    ${[25,50,75,100].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("")}
    ${scores.map((_,i)=>{const p=pt(i,100); return `<line x1="${C}" y1="${C}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)" stroke-width="1"/>`;}).join("")}
    <polygon points="${poly}" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    ${scores.map((x,i)=>{const p=pt(i,x.score); return `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${tone(x.score)}"/>`;}).join("")}
    ${scores.map(label).join("")}
  </svg>`;
}

    {days:"DAYS 1–30",name:"Foundations",color:"#C4540A",items:[`Close tool-access gaps: ${cnt("Access")} people have no approved tool.`,`AI usage-policy module for everyone; ${cnt("Privacy")} people flagged for data-handling risk go first.`,"Publish the approved-tools list and a one-page data do and don't card.","Nominate one AI champion per department."]},

    {days:"DAYS 61–90",name:"Embed and measure",color:"#1E3A8A",items:["Launch a shared prompt and use-case library.","Managers set one AI goal per person and review it in 1:1s.","Track time saved on three to five priority use cases.","Re-run the assessment and compare by dimension and department."]}
  ];
  const rows=scope.slice().sort((a,b)=>b.overall-a.overall);
  return `<section class="stack">
  <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end">
    <div><div class="eyebrow" style="color:var(--accent)">Manager and leadership view</div><h1 class="page">Team AI readiness report</h1></div>
    ${S.includeSample?`<span class="badge">INCLUDES SAMPLE DATA</span>`:""}</div>
  ${sourceBar}
  <div><div id="flt" style="font-size:14px;font-weight:500;color:var(--muted);margin-bottom:10px">Filter by department</div>
    <div class="chips" role="group" aria-labelledby="flt">${["All"].concat(depts).map(d=>`<button type="button" class="opt chip dark" data-dept="${esc(d)}" aria-pressed="${d===S.teamDept}">${d==="All"?"All departments":esc(d)}</button>`).join("")}</div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    <div class="card kpi"><div class="l">Average readiness</div><div class="v">${avg}</div><div style="font-size:14px;font-weight:500">${levelOf(avg).name}</div></div>
    <div class="card kpi"><div class="l">Respondents</div><div class="v">${n}</div><div class="l">${S.teamDept==="All"?"all departments":esc(S.teamDept)}</div></div>
    <div class="card kpi"><div class="l">Ready or above (75+)</div><div class="v">${pct(ready,n)}</div><div class="l">${ready} people</div></div>
    <div class="card kpi warn"><div class="l">With a critical gap</div><div class="v">${flagged}</div><div class="l">${pct(flagged,n)} of respondents</div></div>
  </div>
  <div class="grid wide">
    <div class="card"><h2>Readiness distribution</h2>${dist.map(x=>`<div class="barrow" style="grid-template-columns:140px minmax(0,1fr) 72px"><div><span style="font-weight:500">${x.l.name}</span><small>${x.l.band}</small></div><div class="track" style="height:22px;border-radius:4px"><span style="width:${n?Math.max(x.c?3:0,x.c/n*100):0}%;background:${x.l.color};border-radius:4px;box-shadow:inset 0 0 0 1px var(--muted)"></span></div><span class="mono" style="text-align:right">${x.c} · ${pct(x.c,n)}</span></div>`).join("")}</div>
    <div class="card"><h2>Average score by department</h2>${deptRows.map(x=>`<div class="barrow" style="grid-template-columns:160px minmax(0,1fr) 72px"><span style="font-weight:${x.d===S.teamDept?700:400}">${esc(x.d)}</span><div class="track" style="height:14px;border-radius:4px"><span style="width:${x.avg}%;background:${tone(x.avg)};border-radius:4px"></span></div><span class="mono" style="text-align:right">${x.avg} <small style="display:inline;color:var(--muted)">n${x.n}</small></span></div>`).join("")}</div>
  </div>
  <div class="grid wide">
    <div class="card"><h2>Dimension averages <span style="font-size:13px;font-weight:400;color:var(--muted)">· lowest first</span></h2>${dimAvg.map(x=>`<div class="barrow" style="grid-template-columns:190px minmax(0,1fr) 40px"><span style="font-size:15px">${x.dm.name}</span><div class="track"><span style="width:${Math.max(2,x.avg)}%;background:${tone(x.avg)}"></span></div><span class="num">${x.avg}</span></div>`).join("")}${legendRow()}</div>
    <div class="card"><h2>Highest-risk gaps</h2>${risks.map(x=>`<div class="list-row" style="flex-direction:column;gap:3px"><div style="display:flex;justify-content:space-between;gap:12px"><span style="font-weight:600">${x.f.title}</span><span class="num" style="color:var(--warn)">${x.who.length} people</span></div><span style="font-size:14px;color:var(--muted)">${x.f.rule}</span><span style="font-size:14px;color:var(--ink2)">${x.who.length?x.who.map(p=>p.id).join(", "):"None in this group"}</span></div>`).join("")}</div>
  </div>
  <div class="card"><h2>Recommended interventions</h2><div class="grid" style="gap:14px">${low.map((x,i)=>`<div class="tile"><span class="tag">PRIORITY ${i+1}</span><strong>${x.dm.name} · avg ${x.avg}</strong><p>${x.dm.team}</p></div>`).join("")}</div></div>
  <div class="card"><h2>90-day AI enablement roadmap</h2><div class="grid wide" style="gap:16px">${roadmap.map(ph=>`<div class="phase" style="border-top-color:${ph.color}"><div class="mono" style="font-size:13px;color:var(--muted)">${ph.days}</div><div style="font-weight:600;font-size:17px;margin:4px 0 8px">${ph.name}</div><ul class="clean" style="font-size:14px">${ph.items.map(it=>`<li>${it}</li>`).join("")}</ul></div>`).join("")}</div></div>
  <div class="card"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px"><h2 style="margin:0">Respondent summary</h2><button class="btn" id="teamdl">Export table (CSV)</button></div>
    <div class="tbl"><table><thead><tr><th>ID</th><th>Source</th><th>Department</th><th>Role</th><th>Seniority</th><th>AI use</th><th>Score</th><th>Level</th>${DIMS.map(d=>`<th>${d.short}</th>`).join("")}<th>Flags</th></tr></thead><tbody>
    ${rows.map(p=>`<tr><td class="mono">${esc(p.id)}</td><td>${p.source}</td><td style="white-space:nowrap">${esc(p.dept)}</td><td style="white-space:nowrap">${esc(p.role)}</td><td style="white-space:nowrap">${esc(p.sen)}</td><td>${esc(p.freq)}</td><td class="mono" style="font-weight:600">${p.overall}${p.capped?` <span style="font-weight:400;color:var(--warn-tx)">(capped)</span>`:""}</td><td style="white-space:nowrap">${p.level}</td>${p.dims.map(v=>`<td class="mono ${v<50?"low":""}">${v}</td>`).join("")}<td style="color:var(--warn-tx);white-space:nowrap">${p.flags.join(", ")||"–"}</td></tr>`).join("")}
    </tbody></table></div>
    <p style="font-size:13px;color:var(--muted);margin:12px 0 0">Shaded cells are below 50. Scores with a Privacy flag are capped at ${GOV_CAP}. Flags: Privacy = data-handling risk, Access = no approved tool, Verify = verification gap, Reliance = over-reliance risk.</p></div>
  </section>`;
}
function teamCsv(){
  const {scope}=teamData();
  const head=["id","source","department","role","seniority","ai_frequency","raw_score","overall","level"].concat(DIMS.map(d=>d.id)).concat(["flags"]);
  return [head.join(",")].concat(scope.map(p=>[p.id,p.source,p.dept,p.role,p.sen,p.freq,p.raw,p.overall,p.level].concat(p.dims).concat([p.flags.join("; ")]).map(csvCell).join(","))).join("\n");
}

/* ---------------- Method ---------------- */
function scoringText(q){
  if(q.type==="l") return q.rev ? "Reverse: 6 − answer" : "1–5";
  return q.opts.map(o=>`${o[0]} [${o[1]}]`).join(" · ");
}
function viewMethod(){
  return `<section class="stack">
  <div class="stack" style="gap:8px"><h1 class="page">How the calculator works</h1><p class="lead">Research basis, the full question bank, the scoring model and spreadsheet formulas, the rollout plan and known limitations.</p></div>
  <div class="card"><h2>Assumptions</h2><ul class="clean">
    <li>This is a self-assessment for development planning. It is not a performance rating and should not feed into appraisals.</li>
    <li>Anonymous mode is the default. Group results should only be shown where 5 or more people respond.</li>
    <li>Weights are expert judgement based on the sources below. Re-check them against real data after the first round.</li>
    <li>This page scores answers in the browser. “Save &amp; add to team roster” keeps results only in that browser, which suits a shared workshop device. For organization-wide collection, use the Google Forms and Sheets build below.</li></ul></div>
  <div class="card"><h2>1 · Research basis</h2><div class="tbl"><table style="min-width:720px"><thead><tr><th>Source</th><th>What it contributes</th><th>Used in</th></tr></thead><tbody>
    <tr><td><a href="https://www.prosci.com/blog/how-businesses-assess-readiness-for-ai-adoption">Prosci: How businesses assess readiness for AI adoption</a></td><td>Measuring individual readiness with ADKAR before and during an AI rollout.</td><td>Dimension structure</td></tr>
    <tr><td><a href="https://www.prosci.com/blog/adkar-for-ai-adoption">Prosci: ADKAR for AI adoption</a></td><td>Why AI rollouts stall at the people level; matching interventions to the barrier point.</td><td>Barriers, interventions</td></tr>
    <tr><td><a href="https://www.oecd.org/en/publications/building-an-ai-ready-public-workforce_b89244c7-en.html">OECD: Building an AI-ready public workforce</a></td><td>Readiness includes risk awareness, data protection, ethics, critical thinking and independent judgement.</td><td>Privacy and responsible AI; confidence without over-reliance</td></tr>
    <tr><td><a href="https://sloanreview.mit.edu/article/getting-your-employees-ready-for-work-in-the-age-of-ai">MIT SMR: Getting your employees ready for work in the age of AI</a></td><td>Employee capability gaps and the skills needed to work alongside AI.</td><td>Skills, role fit, applying AI</td></tr>
    <tr><td><a href="https://blogs.microsoft.com/blog/2024/05/08/microsoft-and-linkedin-release-the-2024-work-trend-index-on-the-state-of-ai-at-work/">Microsoft and LinkedIn: 2024 Work Trend Index</a></td><td>Many employees already use AI at work, often with their own tools and without clear guidance or training.</td><td>Access and support; approved-tool flag</td></tr>
    <tr><td><a href="https://www.nist.gov/itl/ai-risk-management-framework">NIST AI Risk Management Framework</a></td><td>Trustworthy-AI properties and human oversight of consequential decisions.</td><td>Responsible-AI scenarios, safety reminders</td></tr>
  </tbody></table></div></div>
  <div class="card"><h2>2 · Dimensions and weights</h2><div class="tbl"><table style="min-width:720px"><thead><tr><th>#</th><th>Dimension</th><th>Framework</th><th>Weight</th><th>Items</th><th>Why this weight</th></tr></thead><tbody>
    ${DIMS.map((d,i)=>`<tr><td class="mono">${i+1}</td><td style="font-weight:500">${d.name}</td><td>${d.basis}</td><td class="mono" style="font-weight:600">${d.w}%</td><td class="mono">${d.qs.length}</td><td style="color:var(--ink2)">${d.rationale}</td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="card"><h2>3 · Full question bank (${TOTAL_Q} items)</h2><p style="margin:0 0 12px;color:var(--muted)">Likert items are scored 1–5 (Strongly disagree to Strongly agree). For multiple-choice and scenario items, the points for each option are shown in brackets.</p>
    <div class="tbl"><table style="min-width:820px"><thead><tr><th>ID</th><th>Dimension</th><th>Type</th><th>Question</th><th>Scoring</th></tr></thead><tbody>
    ${DIMS.map(d=>d.qs.map(q=>`<tr><td class="mono">${q.id}</td><td style="white-space:nowrap">${d.name}</td><td style="white-space:nowrap">${q.type==="l"?"Likert 1–5"+(q.rev?" · R":""):(q.scenario?"Scenario":"Multiple choice")}</td><td>${esc(q.text)}</td><td style="font-size:13px;color:var(--ink2)">${esc(scoringText(q))}</td></tr>`).join("")).join("")}
    </tbody></table></div></div>
  <div class="card"><h2>4 · Scoring model and Google Sheets formulas</h2>
    <div class="grid" style="margin-bottom:16px">
      <div class="tile"><strong>Step 1 · Item to 0–100</strong><p>Answer becomes 1–5 (reverse items: 6 − answer). Item score = (value − 1) ÷ 4 × 100.</p></div>
      <div class="tile"><strong>Step 2 · Dimension score</strong><p>Average of that dimension's item scores, rounded.</p></div>
      <div class="tile"><strong>Step 3 · Overall</strong><p>Σ (dimension score × weight) ÷ 100.</p></div>
      <div class="tile"><strong>Step 4 · Governance cap</strong><p>If the data-handling risk flag is raised, the overall score is capped at ${GOV_CAP} (top of AI Aware) until the gap is fixed.</p></div></div>
    <div class="tbl"><table style="min-width:720px"><thead><tr><th>Purpose</th><th>Formula</th></tr></thead><tbody>
      <tr><td>Likert text to 1–5</td><td><code>=MATCH(B2,{"Strongly disagree","Disagree","Neutral","Agree","Strongly agree"},0)</code></td></tr>
      <tr><td>Item score / reverse item</td><td><code>=(C2-1)/4*100</code> · <code>=(5-C2)/4*100</code></td></tr>
      <tr><td>Multiple-choice points</td><td><code>=VLOOKUP(D2,OptionPoints!A:B,2,FALSE)</code></td></tr>
      <tr><td>Overall score</td><td><code>=ROUND(SUMPRODUCT(DimScores,Weights)/100,0)</code></td></tr>
      <tr><td>Governance cap</td><td><code>=IF(PrivacyFlag="Yes",MIN(RawOverall,${GOV_CAP}),RawOverall)</code></td></tr>
      <tr><td>Readiness level</td><td><code>=IFS(X2&gt;=90,"AI Champion",X2&gt;=75,"AI Confident",X2&gt;=60,"AI Practitioner",X2&gt;=40,"AI Aware",TRUE,"AI Beginner")</code></td></tr>
      <tr><td>Team average, small groups hidden</td><td><code>=IF(COUNTIF(Dept,"Sales")&lt;5,"n&lt;5",AVERAGEIF(Dept,"Sales",Overall))</code></td></tr>
    </tbody></table></div></div>
  <div class="card"><h2>5 · Readiness levels</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
    ${LEVELS.map(l=>`<div class="phase" style="border-top:6px solid ${l.color}"><div class="mono" style="font-size:13px;color:var(--muted)">${l.band} · ${l.label}</div><div style="font-weight:600;font-size:17px">${l.name}</div><p style="margin:4px 0;font-size:14px;color:var(--ink2)">${l.desc}</p><div style="font-size:13px;color:var(--accent);font-weight:500">${l.next}</div></div>`).join("")}</div>
    <p style="margin:12px 0 0;font-size:14px;color:var(--muted)">Critical flags override the level: someone can score as AI Confident and still need to fix a data-handling risk.</p></div>
  <div class="card"><h2>6 · Rollout plan</h2><div class="tbl"><table style="min-width:720px"><thead><tr><th>When</th><th>Step</th><th>Exit criterion</th></tr></thead><tbody>
    <tr><td>Week 0</td><td>Review questions, anonymity and data handling with HR, Legal and Privacy.</td><td>Sign-off; privacy notice written</td></tr>
    <tr><td>Week 1</td><td>Pilot with 5–8 people from different roles.</td><td>Median time under 7 minutes</td></tr>
    <tr><td>Week 2</td><td>Fix wording; build the Form, Sheet and dashboard.</td><td>Formulas tested on sample data</td></tr>
    <tr><td>Weeks 3–4</td><td>Launch with a leadership message: for development, not evaluation.</td><td>Response rate of 70% or more</td></tr>
    <tr><td>Week 5</td><td>Publish the team report and brief managers.</td><td>Every manager briefed</td></tr>
    <tr><td>Quarterly</td><td>Re-run and compare trends by dimension and department.</td><td>Trend report to leadership</td></tr>
  </tbody></table></div></div>
  <div class="card"><h2>7 · Limitations</h2><ul class="clean">
    <li><strong>Self-reported answers</strong>: people often over-rate their skills. Add scenario items, a short practical task and an optional manager rating.</li>
    <li><strong>Weights are expert judgement</strong>: once you have 50+ responses, check consistency (Cronbach's alpha) and re-weight against actual usage.</li>
    <li><strong>Few items per dimension</strong>: a single answer can swing a score. Rotate in tested items over time.</li>
    <li><strong>Scenario answers can be learned</strong>: rotate equivalent scenarios each quarter.</li>
    <li><strong>Small-team anonymity</strong>: enforce the n of 5 or more rule in all team views.</li>
    <li><strong>Intention, not behaviour</strong>: add tool-usage data and time-saved measures.</li></ul></div>
  </section>`;
}

/* ---------------- Render and events ---------------- */
const app = document.getElementById("app");
function render(){
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.tab===S.tab?"page":"false"));
  const prog=document.getElementById("progress");
  prog.style.display = S.tab==="assess" ? "flex" : "none";
  const answered=Object.keys(S.ans).length;
  document.getElementById("pbar").style.width = (S.step===11?100:Math.round(answered/TOTAL_Q*100))+"%";
  document.getElementById("plbl").textContent = S.step===0?"Profile":(S.step===11?"Complete":`${answered} / ${TOTAL_Q} answered`);
  if(S.tab==="team") app.innerHTML=viewTeam();
  else if(S.tab==="method") app.innerHTML=viewMethod();
  else app.innerHTML = S.step===0?viewIntro():(S.step===11?viewResult():viewDim());
}
function go(step){ S.step=step; render(); window.scrollTo(0,0); }
function updateStart(){ const b=document.getElementById("start"); if(b) b.disabled=!profileDone(); }

app.addEventListener("input", e=>{
  const k=e.target.dataset.p; if(!k) return;
  S.profile[k]=e.target.value; updateStart();
});
app.addEventListener("change", e=>{
  if(e.target.id==="anon"){ S.profile.anon=e.target.checked; render(); return; }
  const k=e.target.dataset.p; if(k){ S.profile[k]=e.target.value; updateStart(); }
});
app.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.tool){
    const tool=t.dataset.tool; let list=S.profile.tools.slice();
    if(list.includes(tool)) list=list.filter(x=>x!==tool);
    else if(tool==="None yet") list=["None yet"];
    else { list=list.filter(x=>x!=="None yet"); list.push(tool); }
    S.profile.tools=list;
    app.querySelectorAll("[data-tool]").forEach(b=>b.setAttribute("aria-pressed", list.includes(b.dataset.tool)));
    return;
  }
  if(t.dataset.q){
    S.ans[t.dataset.q]=+t.dataset.k;
    const y=window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if(t.dataset.dept){ S.teamDept=t.dataset.dept; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  switch(t.id){
    case "start": go(1); break;
    case "sample": fillSample(); render(); window.scrollTo(0,0); break;
    case "back": go(S.step-1); break;
    case "next": go(S.step+1); break;
    case "review": go(1); break;
    case "restart": S.ans={}; S.profile=emptyProfile(); S.rid=newId(); S.savedMsg=""; go(0); break;
    case "save": addToRoster(); { const y=window.scrollY; render(); window.scrollTo(0,y); } break;
    case "toggleSample": S.includeSample=!S.includeSample; render(); break;
    case "clearRoster": ROSTER=[]; saveRoster(ROSTER); S.savedMsg=""; render(); break;
    case "dl": download(`ai-readiness-${computeResult().who}.csv`, resultCsv()); break;
    case "teamdl": download("ai-readiness-team.csv", teamCsv()); break;
  }
});
function fromHash(){ const h=location.hash.replace("#",""); S.tab=["assess","team","method"].includes(h)?h:"assess"; render(); }
window.addEventListener("hashchange", ()=>{ fromHash(); window.scrollTo(0,0); });
fromHash();
</script>
